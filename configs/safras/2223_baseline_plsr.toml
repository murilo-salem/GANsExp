[inputs]
features = "{artifacts}/archive/legacy/pipeline/band5_2223/features_5band_2223.csv"
table = "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx"

[execution]
entrypoint = "{root}/code/analysis/baseline_2223_plsr.py"
arguments = [
