  "--table", "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx",
  "--out", "{artifacts}/runs/2223_baseline_plsr/results",
  "--folds", "4",
  "--max-components", "8",
  "--seed", "42",
  "--seeds", "42", "43", "44", "45", "46",
  "--protocols", "holdout_70_30", "holdout_80_20", "groupkfold_4", "logo",
  "--by-stage",
]
