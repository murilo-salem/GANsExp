[experiment]
run_id = "2223_gan_architecture_search_masked"
season = "2022_2023"
target = "Biomassa+Produtividade"
validation_unit = "bloco+dose"
description = "Rerun mascarada e agregada: RS, dose e RS+dose em 24 unidades de campo"

[inputs]
dataset = "{artifacts}/runs/gan_architecture_search/dataset"
source_stage4 = "{artifacts}/runs/2223_stage4_residual/results"
source_table = "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx"

[execution]
module = "milho_experiment.pipeline.stage_05_synthesis.stage14_architecture_search"
arguments = [
  "selection",
  "--dataset", "{artifacts}/runs/gan_architecture_search/dataset",
  "--source-stage4", "{artifacts}/runs/2223_stage4_residual/results",
  "--source-table", "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx",
  "--out", "{artifacts}/runs/2223_gan_architecture_search_masked/results",
  "--tracks", "A", "B",
  "--models", "unet_l1", "attention_unet", "convlstm_lite", "simvp_lite", "oracle_real",
  "--targets", "Biomassa", "Produtividade",
  "--seeds", "7", "11", "23",
  "--epochs", "200",
  "--batch-size", "4",
  "--crop-size", "128",
  "--width", "32",
  "--bootstrap", "10000",
  "--sample-images", "2",
]
