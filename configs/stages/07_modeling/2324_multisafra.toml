[experiment]
run_id = "2324_multisafra_biomassa"
season = "2023_2024"
target = "Biomassa"
validation_unit = "parcela"

[inputs]
features_2223 = "{artifacts}/archive/legacy/pipeline/band5_2223/features_5band_2223.csv"
table_2223 = "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx"
features_2324 = "{artifacts}/archive/legacy/pipeline/plsr_2324/features_ortho_2324.csv"
targets_2324 = "{artifacts}/archive/legacy/pipeline/plsr_2324/targets_ortho_2324.csv"

[execution]
module = "milho_experiment.pipeline.stage_07_modeling.stage_multisafra"
arguments = [
  "--feat2223", "{artifacts}/archive/legacy/pipeline/band5_2223/features_5band_2223.csv",
  "--table2223", "{data}/raw/safra_2022_2023/field/parametros_2223_normalizado.xlsx",
  "--feat2324", "{artifacts}/archive/legacy/pipeline/plsr_2324/features_ortho_2324.csv",
  "--tgt2324", "{artifacts}/archive/legacy/pipeline/plsr_2324/targets_ortho_2324.csv",
  "--target", "Biomassa", "--out", "{artifacts}/runs/2324_multisafra_biomassa/results",
]
